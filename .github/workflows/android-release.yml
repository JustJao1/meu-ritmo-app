name: Preparar APK Android assinado
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app-web/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android do runner
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar Android SDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verificar segredos de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if test -z "$KEYSTORE_BASE64" || test -z "$KEYSTORE_PASSWORD" || test -z "$KEY_ALIAS" || test -z "$KEY_PASSWORD"; then
            echo "::error::As credenciais da chave original de assinatura Android não estão configuradas. A versão 1.0.2 NÃO foi publicada."
            echo "É necessário configurar ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_SIGNING_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_READY=true" >> "$GITHUB_ENV"
      - name: Testar e compilar APK de produção
        if: env.ANDROID_SIGNING_READY == 'true'
        working-directory: android
        env:
          ANDROID_SIGNING_STORE: ${{ env.ANDROID_SIGNING_STORE }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace lintRelease testDebugUnitTest assembleRelease
      - name: Validar assinatura e hash
        if: env.ANDROID_SIGNING_READY == 'true'
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          OLD="$RUNNER_TEMP/Meu-Ritmo-1.0.1.apk"
          curl --fail --location --silent --show-error 'https://github.com/JustJao1/meu-ritmo-app/releases/download/v1.0.1/Meu-Ritmo-1.0.1.apk' --output "$OLD"
          echo "7c2ac22c23a35ca451dc8ca1389cf0a1e6a0a6cc504d4ff8d294080a97d0e6e3  $OLD" | sha256sum -c -
          OLD_CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$OLD" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          NEW_CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT" || { echo 'Certificado de assinatura diferente da versão instalada; publicação cancelada.'; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1 | grep -E "versionCode='5' versionName='1\\.0\\.2'"
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_SIGNING_READY == 'true'
        with:
          name: mr-meu-ritmo-app-release-assinado
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK Android 1.0.2 verificado
        if: env.ANDROID_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          if gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release 1.0.2 já existe. Nada será sobrescrito.'
            exit 0
          fi
          gh release create v1.0.2 "$APK#Meu-Ritmo-1.0.2.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'MR: Meu Ritmo App 1.0.2' --notes 'APK assinado com o certificado original, verificado contra a versão 1.0.1, com acesso online e alarmes locais.'
